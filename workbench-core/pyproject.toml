[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-core"
version = "0.1.0"
description = "Shared engine of the Workbench programs (Kaligraf, Glow, Maker): text, logos, geometry, OrcaSlicer 3MF, renders, PDFs, estimates"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.40",
    "shapely>=2.0",
    "manifold3d>=2.5",
    "trimesh>=4.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "mapbox-earcut>=1.0",
    "scipy>=1.11",
    "uharfbuzz>=0.38",
    "opencv-python-headless>=4.8",
    "potracer>=0.0.4",
    "svgelements>=1.9",
    "pillow>=10",
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
