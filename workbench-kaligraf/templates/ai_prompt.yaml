# AI image prompt template (TR + EN). Auto fields come from the job; user fields have defaults and
# are filled from the UI form. Each choice has a Turkish and an English wording; a value that is not
# one of the keys is used verbatim in both languages (free text).
version: 1

user_fields:
  scene:
    label: Mekan
    default: salon
    choices:
      salon: {tr: "modern bir oturma odası (salon)", en: "a modern living room"}
      ofis: {tr: "şık bir ofis / çalışma alanı", en: "a stylish office"}
      kafe: {tr: "samimi bir kafe", en: "a cosy café"}
      vitrin: {tr: "bir mağaza vitrini", en: "a shop window display"}
      cocuk_odasi: {tr: "renkli bir çocuk odası", en: "a bright children's room"}
  wall:
    label: Duvar rengi / dokusu
    default: beyaz
    choices:
      beyaz: {tr: "pürüzsüz beyaz boyalı duvar", en: "a smooth white painted wall"}
      gri: {tr: "açık gri boyalı duvar", en: "a light grey painted wall"}
      bej: {tr: "sıcak bej sıvalı duvar", en: "a warm beige plastered wall"}
      tugla: {tr: "beyaza boyanmış tuğla duvar", en: "a white-painted brick wall"}
      beton: {tr: "çıplak beton duvar", en: "a raw concrete wall"}
      ahsap: {tr: "ahşap panel kaplı duvar", en: "a wood-panelled wall"}
      lacivert: {tr: "koyu lacivert duvar", en: "a deep navy wall"}
  lighting:
    label: Işık
    default: gun_isigi
    choices:
      gun_isigi: {tr: "yumuşak doğal gün ışığı", en: "soft natural daylight"}
      sicak: {tr: "sıcak akşam ışığı", en: "warm evening light"}
      studyo: {tr: "yumuşak stüdyo ışığı", en: "soft studio lighting"}
      yan_isik: {tr: "yandan gelen belirgin ışıkla hafif gölgeler", en: "side light casting subtle shadows"}
  camera:
    label: Kamera açısı
    default: karsidan
    choices:
      karsidan: {tr: "tam karşıdan, göz hizasında", en: "straight-on at eye level"}
      hafif_yan: {tr: "hafif yandan", en: "from a slight angle"}
      ucte_bir: {tr: "3/4 açıyla, derinlik görünecek şekilde", en: "at a three-quarter angle showing the depth"}
      yakin: {tr: "yakın çekim, makro ayrıntı", en: "close-up with macro detail"}
  scale_ref:
    label: Ölçek referansı nesne
    default: kanepe
    choices:
      kanepe: {tr: "altında bir kanepe", en: "a sofa below it"}
      masa: {tr: "altında bir yazı masası", en: "a desk below it"}
      bitki: {tr: "yanında bir saksı bitkisi", en: "a potted plant beside it"}
      kapi: {tr: "yanında bir kapı", en: "a door beside it"}
      yok: {tr: "", en: ""}
  extra:
    label: Ek ayrıntılar
    default: ""

templates:
  tr: >-
    Fotogerçekçi bir iç mekan fotoğrafı. Mekan: {scene}. Duvar: {wall}. Ürün: duvarda asılı,
    "{text}" yazan {product_tr}. {dimension_tr} {color_tr} {material_tr} {font_tr} {mounting_tr}
    {scale_tr} Işık: {lighting}. Kamera: {camera}. Ekli referans görseldeki ürünün şeklini, harf
    biçimlerini, renklerini ve oranlarını birebir koru; yazıyı değiştirme, harf ekleme veya çıkarma.
    Gerçekçi gölgeler, yüksek ayrıntı, mat yüzey, temiz kompozisyon.{extra_tr}
  en: >-
    A photorealistic interior photo. Setting: {scene}. Wall: {wall}. Product: {product_en} reading
    "{text}", mounted on the wall. {dimension_en} {color_en} {material_en} {font_en} {mounting_en}
    {scale_en} Lighting: {lighting}. Camera: {camera}. Keep the product in the attached reference
    image exactly as it is: same letter shapes, colours and proportions; do not change, add or remove
    any letters. Realistic shadows, fine detail, matte finish, clean composition.{extra_en}
