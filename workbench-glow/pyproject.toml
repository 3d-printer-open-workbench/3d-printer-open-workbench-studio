[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-glow"
version = "0.1.0"
description = "LED lightbox generator (Open Workbench Studio)"
requires-python = ">=3.11"
dependencies = ["workbench-core", "workbench-kaligraf"]

[project.scripts]
glow = "glow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glow = ["*.yaml"]
