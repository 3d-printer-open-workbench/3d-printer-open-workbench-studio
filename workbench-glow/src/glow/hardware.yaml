# Workbench - Glow hardware library (user-editable; override with $GLOW_HARDWARE or ~/.config/workbench-glow/hardware.yaml).
# Lengths mm, prices TRY. NO strips/controllers have been bought yet: every value below is an ASSUMPTION based on
# typical market products (generic AliExpress / Trendyol / Hepsiburada listings, IP30 bare strip, 3M tape back), NOT a
# measurement. Re-measure with calipers when the parts arrive and edit (G7 UI: "Donanım" tab). Each entry says
# what it is assumed to be ("assume:") and where a number comes from ("src:").
usb:
  limits_w: {usb_5v_2a: 10.0, usb_5v_3a: 15.0}
  voltage: 5.0

leds:
  # assume: 5 V USB-powered COB strip, 5 mm PCB, 480 chips/m "dot-free" type, single colour (warm/neutral white), IP30.
  # src: typical listing data (5 V COB 5 mm: ~5-8 W/m, PCB ~1.0 mm + COB film ~0.3). Cut marks vary by seller (every 25-50 mm).
  cob_5mm:
    label: "COB şerit 5 mm (tek renk)"
    addressable: false
    width_mm: 5.0
    thickness_mm: 1.2
    cut_pitch_mm: 25.0
    min_bend_radius_mm: 15.0
    w_per_m: 5.0
    ma_per_led: null          # not per-LED: use w_per_m
    leds_per_m: 480
    price_try_per_m: 90
    note: "ASSUMPTION: generic 5 V COB 5 mm, 480 chips/m, IP30, 3M tape back; ~5 W/m (1 A/m) from typical Trendyol/AliExpress listings; cut mark every 25 mm varies by seller (25-50 mm) - check the marks on the real strip."
  # assume: 5 V COB 8 mm, 480 chips/m, single colour, IP30 (src: typical listing, ~8-10 W/m at 5 V). Cut pitch assumed 25 mm.
  cob_8mm:
    label: "COB şerit 8 mm (tek renk)"
    addressable: false
    width_mm: 8.0
    thickness_mm: 1.2
    cut_pitch_mm: 25.0
    min_bend_radius_mm: 18.0
    w_per_m: 7.0
    ma_per_led: null
    leds_per_m: 480
    price_try_per_m: 110
    note: "ASSUMPTION: generic 5 V COB 8 mm, 480 chips/m, IP30; ~7 W/m (1.4 A/m) from typical listings; cut every 25 mm (varies 25-50 mm); bend radius of COB FPC is coarse (~18 mm)."
  # assume: 5 V COB 10 mm, 480 chips/m, single colour, IP30 (src: typical listing, ~9-12 W/m at 5 V).
  cob_10mm:
    label: "COB şerit 10 mm (tek renk)"
    addressable: false
    width_mm: 10.0
    thickness_mm: 1.2
    cut_pitch_mm: 25.0
    min_bend_radius_mm: 20.0
    w_per_m: 9.0
    ma_per_led: null
    leds_per_m: 480
    price_try_per_m: 130
    note: "ASSUMPTION: generic 5 V COB 10 mm, 480 chips/m, IP30; ~9 W/m (1.8 A/m) from typical listings; cut every 25 mm (varies)."
  # assume: cheap 5 V USB SMD2835 strip, 8 mm PCB, 60 LED/m, single colour, IP30 (src: typical 'USB 5V LED şerit' listing).
  smd2835_8mm:
    label: "SMD2835 şerit 8 mm (tek renk, 60 LED/m)"
    addressable: false
    width_mm: 8.0
    thickness_mm: 1.6
    cut_pitch_mm: 50.0
    min_bend_radius_mm: 15.0
    w_per_m: 6.0
    ma_per_led: null
    leds_per_m: 60
    price_try_per_m: 50
    note: "ASSUMPTION: 5 V USB SMD2835 strip, 8 mm, 60 LED/m, IP30, ~6 W/m (20 mA per LED); 5 V strips are usually cut every 3 LEDs = 50 mm; point LEDs need a larger gap than COB."
  # assume: WS2812B-type addressable strip, 5 mm wide PCB, 60 LED/m, IP30 bare, 5 V. 60 mA/LED worst case (all white)
  # => 0.3 W/LED => 18 W/m (src: WS2812B datasheet 5050; mini 5 mm variants use 2020/3535 chips with less current - kept worst case).
  # Cut pitch = LED pitch 16.67 mm. Thickness assumes ~2.0 mm (PCB + chip) without tape.
  ws2812b_5mm:
    label: "WS2812B şerit 5 mm (RGBIC)"
    addressable: true
    width_mm: 5.0
    thickness_mm: 2.0
    cut_pitch_mm: 16.67
    min_bend_radius_mm: 10.0
    w_per_m: 12.0             # full white, 60 LED/m x 40 mA x 5 V
    ma_per_led: 40
    leds_per_m: 60
    price_try_per_m: 140
    note: "ASSUMPTION: narrow 5 mm WS2812B-type strip (2020/3535 chips), 60 LED/m, bare IP30, 5 V; ~40 mA per LED at full white (smaller package than the 60 mA 5050); cut every LED (16.67 mm); 2.0 mm thick without tape."
  # assume: standard WS2812B 5050 strip, 10 mm PCB, 60 LED/m, IP30 bare, 5 V (the common "WS2812B 60/m" listing).
  # 60 mA/LED full white (src: datasheet) => 18 W/m. Thickness ~2.5 mm (5050 package 1.6 mm + PCB + solder pads).
  ws2812b_10mm:
    label: "WS2812B şerit 10 mm (RGBIC)"
    addressable: true
    width_mm: 10.0
    thickness_mm: 2.5
    cut_pitch_mm: 16.67
    min_bend_radius_mm: 12.0
    w_per_m: 18.0
    ma_per_led: 60
    leds_per_m: 60
    price_try_per_m: 160
    note: "ASSUMPTION: the usual 'WS2812B 60 LED/m' 10 mm strip (5050), bare IP30, 5 V; 60 mA per LED at full white (datasheet) = 18 W/m; cut every LED (16.67 mm); ~2.5 mm thick."

controllers:
  # assume: inline USB 5 V PWM dimmer / touch dimmer module for single-colour COB (src: typical listing ~ 30-40 x 15-20 x 8 mm).
  usb_dimmer:
    label: "USB dimmer (tek renk)"
    pocket_mm: [38.0, 20.0, 9.0]      # L x W x H
    cable_side: left
    clearance_mm: 1.0
    supports: [cob_5mm, cob_8mm, cob_10mm, smd2835_8mm]
    price_try: 60
    note: "ASSUMPTION: inline USB 5 V touch/PWM dimmer module for single-colour strips, ~38 x 20 x 9 mm (typical listings 30-40 x 15-20 mm)."
  # assume: common "Bluetooth USB 5 V mini LED controller" for WS2812B (SP-style app control, USB-A plug in, 3-pin out),
  # ~38 x 22 x 9 mm incl. connector (src: typical listings; sizes vary 30-45 mm, pocket kept generous).
  bt_rgb_mini:
    label: "Bluetooth RGB mini kontrolcü"
    pocket_mm: [42.0, 24.0, 10.0]
    cable_side: left
    clearance_mm: 1.0
    supports: [ws2812b_5mm, ws2812b_10mm]
    price_try: 110
    note: "ASSUMPTION: common 'USB 5 V Bluetooth mini LED controller' (app-controlled, USB-A in, 3-pin out) ~38 x 22 x 9 mm; sizes vary 30-45 mm, pocket kept generous."
  # assume: ESP32 DevKit (30/38-pin, ~52 x 28.5 mm, USB micro/C on one short side) running WLED; ~13 mm tall with headers
  # (src: Espressif DevKitC / generic DevKit v1 dimensions) + 3-pin JST/Wago wiring room => pocket 58 x 31 x 16.
  esp32_wled:
    label: "ESP32 WLED kontrolcü"
    pocket_mm: [58.0, 31.0, 16.0]
    cable_side: left
    clearance_mm: 1.2
    supports: [ws2812b_5mm, ws2812b_10mm]
    price_try: 220
    note: "ASSUMPTION: ESP32 DevKit (30/38-pin, ~52 x 28.5 mm, ~13 mm tall with headers) running WLED + wiring room => pocket 58 x 31 x 16."

# diffuser (assume: generic white PLA / natural PETG filament, 0.4 mm nozzle, thickness is a starting guess until the
# calibration coupon (0.6-2.4 mm ladder) is printed and held in front of the real strip; min_gap = LED-to-diffuser distance
# for no visible hot spots: ~10 mm for COB, ~14-18 mm for 60 LED/m point sources - src: common lightbox rules of thumb)
# diffuser: thickness per LED type (mm) and minimum LED-to-face gap (inside face surface to LED top)
diffusers:
  pla_white:
    label: "PLA beyaz (difüzör)"
    color: "#F5F5F5"
    price_try_per_kg: 600
    thickness_mm: {cob_5mm: 0.8, cob_8mm: 0.8, cob_10mm: 0.8, smd2835_8mm: 1.2, ws2812b_5mm: 1.2, ws2812b_10mm: 1.2}
    min_gap_mm:   {cob_5mm: 10.0, cob_8mm: 10.0, cob_10mm: 10.0, smd2835_8mm: 15.0, ws2812b_5mm: 14.0, ws2812b_10mm: 16.0}
    note: "ASSUMPTION: generic white PLA (translucent at 0.8-1.2 mm); thickness/gap are starting guesses until the calibration coupon is printed and held in front of the strip."
  petg_natural:
    label: "PETG doğal (difüzör)"
    color: "#E8E4D6"
    price_try_per_kg: 750
    thickness_mm: {cob_5mm: 1.0, cob_8mm: 1.0, cob_10mm: 1.0, smd2835_8mm: 1.4, ws2812b_5mm: 1.4, ws2812b_10mm: 1.4}
    min_gap_mm:   {cob_5mm: 12.0, cob_8mm: 12.0, cob_10mm: 12.0, smd2835_8mm: 17.0, ws2812b_5mm: 16.0, ws2812b_10mm: 18.0}
    note: "ASSUMPTION: natural/clear PETG is more transparent than PLA, so it needs more thickness and gap to hide the LED points."
other_prices_try:
  usb_cable: 40
  usb_adapter: 90
  body_filament_per_kg: 600
  # assume: M3 x 8 mm self-tapping / pan-head screws, ~1 TRY each in a 50-100 pack; wire for jumpers + connectors per job
  screw_m3: 1.5
  wire_per_m: 15
